name: Code quality

on:
  push:
  pull_request:

jobs:
  syntax-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile Python sources
        run: python -m compileall -q scripts
      - name: Parse JSON configuration and aggregate summaries
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          files = [Path('config/pipeline_parameters.json'), *Path('results').glob('*.json')]
          for path in files:
              with path.open(encoding='utf-8') as f:
                  json.load(f)
          print(f'Parsed {len(files)} JSON files.')
          PY

  synthetic-reproducibility-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install analysis dependencies
        run: python -m pip install numpy==1.26.4 pandas==2.2.2 scipy==1.13.1 scikit-learn==1.4.2 matplotlib==3.8.4
      - name: Run nonparticipant reproducibility smoke tests
        run: python -m unittest discover -s tests -v
